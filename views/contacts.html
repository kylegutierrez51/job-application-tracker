<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts</title>
    <link rel="stylesheet" href="../styles/general.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/subheader.css" />
    <link rel="stylesheet" href="../styles/table.css" />
    <link rel="stylesheet" href="../styles/page-view.css" />
    <link rel="stylesheet" href="../styles/modal.css" />
    <link rel="stylesheet" href="../styles/add-modals/shared-add-box.css" />
    <link rel="stylesheet" href="../styles/add-modals/contacts.css" />
    <link rel="stylesheet" href="../styles/detail-modal.css" />

    <script type="module" src="../js-scripts/header.js" defer></script>
    <script type="module" src="../js-scripts/subheader.js" defer></script>
    <script type="module" src="../js-scripts/table.js" defer></script>
    <script type="module" src="../js-scripts/modals/form-modal.js" defer></script>
    <script type="module" src="../js-scripts/modals/contact-detail-modal.js" defer></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js" defer></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js" defer></script>
  </head>

  <body>
    <header class="js-header-nav"></header>
    <section class="subheader js-subheader"></section>

    <main class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Company</th>
            <th>Title</th>
            <th>Email</th>
            <th>Phone</th>
            <th>LinkedIn</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody class="js-table-rows"></tbody>
      </table>
    </main>

    <section class="page-view js-page-view"></section>

    <div class="modal-overlay" id="detail-modal-overlay">
      <div class="container">
        <div class="container-header">
          <h3>Contact Details</h3>
          <button class="close-btn" id="close-details-btn">x</button>
        </div>

        <div class="detail-grid">
          <div class="detail-field">
            <label>Name</label>
            <span id="detail-name" class="detail-view-value"></span>
            <input id="edit-name" class="detail-edit-input" />
          </div>
          <div class="detail-field">
            <label>Company</label>
            <span id="detail-company" class="detail-view-value"></span>
            <select id="edit-company" class="detail-edit-select">
              <option value="" disabled>Select...</option>
              <option value="Stripe">Stripe</option>
              <option value="Figma">Figma</option>
              <option value="Notion">Notion</option>
              <option value="Vercel">Vercel</option>
              <option value="Linear">Linear</option>
              <option value="Datadog">Datadog</option>
              <option value="Plaid">Plaid</option>
            </select>
          </div>
          <div class="detail-field">
            <label>Title</label>
            <span id="detail-title" class="detail-view-value"></span>
            <input id="edit-title" class="detail-edit-input" />
          </div>
          <div class="detail-field">
            <label>Email</label>
            <span id="detail-email" class="detail-view-value"></span>
            <input id="edit-email" class="detail-edit-input" />
          </div>
          <div class="detail-field">
            <label>Phone</label>
            <span id="detail-phone" class="detail-view-value"></span>
            <input id="edit-phone" class="detail-edit-input" />
          </div>
          <div class="detail-field">
            <label>LinkedIn</label>
            <span id="detail-linkedin" class="detail-view-value"></span>
            <input id="edit-linkedin" class="detail-edit-input" />
          </div>
          <div class="detail-field">
            <label>Created</label>
            <span id="detail-created"></span>
          </div>
          <div class="detail-field detail-field--full">
            <label>Notes</label>
            <span id="detail-notes" class="detail-view-value"></span>
            <textarea id="edit-notes" class="detail-edit-textarea"></textarea>
          </div>
        </div>

        <div class="detail-actions">
          <button class="delete-btn detail-view-btn">Delete</button>
          <button class="edit-btn detail-view-btn">Edit</button>
          <button class="cancel-edit-btn detail-edit-btn">Cancel</button>
          <button class="save-btn detail-edit-btn">Save</button>
        </div>
      </div>
    </div>

    <dialog class="modal-overlay" id="modal-overlay">
      <div class="container">
        <div class="container-header">
          <h3>New Contact</h3>
          <button class="close-btn" id="close-btn">x</button>
        </div>
        
        <form action="/url_route" method="POST">
          <div class="contacts-grid-container">
            <div class="firstname-box">
              <label>First Name</label>
              <input />
            </div>

            <div class="lastname-box">
              <label>Last Name</label>
              <input />
            </div>

            <div class="company-box">
              <label>Company</label>
              <select>
                <option value="" disabled selected>Select...</option>
                <option value="1">Stripe</option>
                <option value="2">Figma</option>
                <option value="3">Notion</option>
                <option value="4">Vercel</option>
                <option value="5">Linear</option>
                <option value="6">Datadog</option>
                <option value="7">Plaid</option>
              </select>
            </div>

            <div class="job-title-box">
              <label>Job Title</label>
              <input />
            </div>

            <div class="email-box">
              <label>Email</label>
              <input />
            </div>

            <div class="phone-box">
              <label>Phone</label>
              <input />
            </div>

            <div class="linkedin-box">
              <label>LinkedIn URL</label>
              <input />
            </div>

            <div class="notes-box">
              <label>Notes</label>
              <textarea></textarea>
            </div>
          </div>
        </form>

        <div class="options">
          <button id="cancel-btn" class="cancel-btn">Cancel</button>
          <button id="create-btn" class="create-btn">Create</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
