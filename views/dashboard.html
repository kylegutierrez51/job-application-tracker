<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../styles/general.css">
  <link rel="stylesheet" href="../styles/header.css">
  <link rel="stylesheet" href="../styles/subheader.css">
  <link rel="stylesheet" href="../styles/dashboard.css">
  <link rel="stylesheet" href="../styles/page-view.css">
</head>

<body>
  <header class="js-header-nav"></header>

  <section class="summary-cards">
    <div class="grid-container">
      <div class="card">
        <p class="card-label">Total Applications</p>
        <span class="card-value">24</span>
      </div>
      <div class="card">
        <p class="card-label">Active Applications</p>
        <span class="card-value">12</span>
      </div>
      <div class="card">
        <p class="card-label">Companies Tracked</p>
        <span class="card-value">4</span>
      </div>
      <div class="card">
        <p class="card-label">Response Rate</p>
        <span class="card-value">63%</span>
      </div>
      <div class="card">
        <p class="card-label">Cover Letter Rate</p>
        <span class="card-value">90%</span>
      </div>
      <div class="card">
        <p class="card-label">Offers Received</p>
        <span class="card-value">1</span>
      </div>
    </div>
  </section>

</body>
<script type="module" src="../js-scripts/header.js"></script>
<script type="module" src="../js-scripts/subheader.js"></script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</html>
