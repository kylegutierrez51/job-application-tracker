{% extends "base.html" %}

{% block title %}Job Match{% endblock %}

{% block links %}
  <link rel="stylesheet" href="../static/styles/subheader.css" />
  <link rel="stylesheet" href="../static/styles/post-forms/shared-post-form.css" />
  <link rel="stylesheet" href="../static/styles/job-match.css" />
{% endblock %}

{% block scripts %}
  <script type="module" src="../static/js/subheader.js" defer></script>
  <script type="module" src="../static/js/job-match.js" defer></script>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js" defer></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js" defer></script>
{% endblock %}

{% block content %}
  <section class="subheader js-subheader"></section>

  <script id="jobs-data" type="application/json">{{ jobs | tojson }}</script>

  <main class="job-match-wrapper">

    <div class="skill-input-section">
      <label class="skill-input-label">Your Skills</label>
      <div class="tag-input-wrapper" id="match-skills-tags">
        <input
          type="text"
          id="match-skill-input"
          class="tag-text-input"
          placeholder="Type a skill and press Enter..."
          autocomplete="off"
        />
      </div>
      <p class="skill-input-hint">
        Press <kbd>Enter</kbd> or <kbd>,</kbd> to add a skill &mdash; click <strong>&times;</strong> on a tag to remove it.
      </p>
    </div>

    <div class="match-results-header">
      <span id="match-results-count" class="match-results-count"></span>
    </div>

    <div id="match-results" class="match-results-grid"></div>

  </main>
{% endblock %}
